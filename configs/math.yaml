entrypoint: orpg.adapters.verl_objective_wise_main
overrides:
- data.train_files=${TRAIN_DATA}
- data.val_files=${VALID_DATA}
- data.prompt_key=prompt
- data.train_batch_size=512
- data.max_prompt_length=1024
- data.max_response_length=8000
- data.filter_overlong_prompts=true
- data.truncation=error
- data.return_raw_chat=true
- data.shuffle=true
- data.seed=42
- algorithm.adv_estimator=gdpo
- algorithm.norm_adv_by_std_in_grpo=true
- algorithm.use_kl_in_reward=false
- algorithm.kl_ctrl.kl_coef=0.0
- actor_rollout_ref.model.path=${POLICY_MODEL}
- actor_rollout_ref.model.trust_remote_code=false
- actor_rollout_ref.model.use_remove_padding=true
- actor_rollout_ref.model.enable_gradient_checkpointing=true
- actor_rollout_ref.model.lora_rank=0
- actor_rollout_ref.model.lora.rank=0
- actor_rollout_ref.actor.ppo_mini_batch_size=64
- actor_rollout_ref.actor.ppo_epochs=1
- actor_rollout_ref.actor.data_loader_seed=42
- actor_rollout_ref.actor.use_dynamic_bsz=true
- actor_rollout_ref.actor.ppo_max_token_len_per_gpu=16384
- actor_rollout_ref.actor.clip_ratio_low=0.2
- actor_rollout_ref.actor.clip_ratio_high=0.28
- actor_rollout_ref.actor.loss_agg_mode=seq-mean-token-mean
- actor_rollout_ref.actor.entropy_coeff=0
- actor_rollout_ref.actor.use_kl_loss=true
- actor_rollout_ref.actor.kl_loss_coef=0.0005
- actor_rollout_ref.actor.kl_loss_type=mse
- actor_rollout_ref.actor.grad_clip=1.0
- actor_rollout_ref.actor.optim.optimizer=AdamW
- actor_rollout_ref.actor.optim.optimizer_impl=torch.optim
- actor_rollout_ref.actor.optim.lr=1e-06
- actor_rollout_ref.actor.optim.betas=[0.9,0.999]
- actor_rollout_ref.actor.optim.weight_decay=0.01
- actor_rollout_ref.actor.optim.lr_scheduler_type=constant
- actor_rollout_ref.actor.optim.lr_warmup_steps=-1
- actor_rollout_ref.actor.optim.lr_warmup_steps_ratio=0.0
- actor_rollout_ref.actor.optim.clip_grad=1.0
- actor_rollout_ref.actor.optim.override_optimizer_config={eps:1e-8}
- actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra,hf_model]
- actor_rollout_ref.actor.checkpoint.load_contents=[model,optimizer,extra]
- actor_rollout_ref.actor.fsdp_config.param_offload=false
- actor_rollout_ref.actor.fsdp_config.optimizer_offload=false
- actor_rollout_ref.actor.fsdp_config.fsdp_size=-1
- actor_rollout_ref.actor.fsdp_config.seed=42
- actor_rollout_ref.rollout.name=vllm
- actor_rollout_ref.rollout.mode=async
- actor_rollout_ref.rollout.n=8
- actor_rollout_ref.rollout.temperature=1.0
- actor_rollout_ref.rollout.top_p=1.0
- actor_rollout_ref.rollout.top_k=-1
- actor_rollout_ref.rollout.tensor_model_parallel_size=1
- actor_rollout_ref.rollout.gpu_memory_utilization=0.6
- actor_rollout_ref.rollout.enable_chunked_prefill=true
- actor_rollout_ref.rollout.max_num_batched_tokens=16384
- actor_rollout_ref.rollout.max_model_len=10240
- actor_rollout_ref.rollout.max_num_seqs=1024
- actor_rollout_ref.rollout.log_prob_use_dynamic_bsz=true
- actor_rollout_ref.rollout.log_prob_max_token_len_per_gpu=16384
- actor_rollout_ref.ref.log_prob_use_dynamic_bsz=true
- actor_rollout_ref.ref.log_prob_max_token_len_per_gpu=16384
- actor_rollout_ref.ref.fsdp_config.param_offload=false
- reward.reward_manager.source=importlib
- reward.reward_manager.name=MathStageARewardManager
- reward.reward_manager.module.path=${CODE_ROOT}/src/orpg/adapters/verl_math_reward.py
- reward.reward_manager.module.name=MathStageARewardManager
- +reward.stage_a_length_threshold=4000
- trainer.balance_batch=true
- trainer.critic_warmup=0
- trainer.logger=[console]
- trainer.project_name=ORPG
- trainer.experiment_name=${RUN_NAME}
- trainer.n_gpus_per_node=8
- trainer.nnodes=1
- trainer.total_training_steps=100
- trainer.total_epochs=30
- trainer.save_freq=50
- trainer.test_freq=-1
- trainer.val_before_train=false
- trainer.resume_mode=disable
- trainer.resume_from_path=null
- trainer.default_local_dir=${OUTPUT_DIR}/checkpoints/${RUN_NAME}
- trainer.rollout_data_dir=null
- trainer.use_legacy_worker_impl=disable
- +algorithm.gdpo_reward_keys=[correctness_reward,length_reward]
- +algorithm.gdpo_reward_weights=[1.0,1.0]
- +actor_rollout_ref.actor.policy_loss.objective_wise_aggregator=pcgrad_priority
- +actor_rollout_ref.actor.policy_loss.objective_wise_reward_count=2
- +algorithm.objective_wise_filtering_mode=none
- +algorithm.objective_wise_advantage_scaling=primary_grpo_secondary_raw
- +algorithm.objective_wise_validity_mode=exact_zero
- +algorithm.objective_wise_competence_routing=correct_subset_centered
- +actor_rollout_ref.actor.policy_loss.objective_wise_positive_rule=C
- +actor_rollout_ref.actor.policy_loss.objective_wise_positive_strength=0.25
- +actor_rollout_ref.actor.policy_loss.objective_wise_positive_q=0.5
- +actor_rollout_ref.actor.policy_loss.objective_wise_positive_preserve_norm=true
