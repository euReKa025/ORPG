[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orpg"
version = "0.1.0"
description = "Objective-wise policy optimization with gradient reconciliation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.26,<2", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
data = ["pyarrow>=18", "math-verify==0.9.0", "transformers==4.57.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
